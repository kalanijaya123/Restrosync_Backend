server.port=8080
server.address=0.0.0.0

# MONGODB - Uses env variable in production, falls back to local
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/restrosync}
spring.data.mongodb.database=restrosync

# App
spring.application.name=RestroSync Backend

# CORS - Uses env variable in production, falls back to local and LAN dev hosts
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://192.168.*.*:5173,http://192.168.*.*:5174,http://192.168.*.*:5175}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Cloudinary

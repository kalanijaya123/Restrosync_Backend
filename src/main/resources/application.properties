server.port=8080
server.address=0.0.0.0

# MONGODB - Uses env variable in production, falls back to local with short fail-fast timeouts
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/restrosync?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000&socketTimeoutMS=3000}
spring.data.mongodb.database=restrosync

# App
spring.application.name=RestroSync Backend

# CORS - Uses env variable in production, falls back to local and LAN dev hosts
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://192.168.*.*:5173,http://192.168.*.*:5174,http://192.168.*.*:5175}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Cloudinary
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME:dt0bdj2xg}
cloudinary.api.key=${CLOUDINARY_API_KEY:732394989442132}
cloudinary.api.secret=${CLOUDINARY_API_SECRET:cNZ2t6F9wXhwh1EpT_LyqbPZNDQ}

# SMS notifications
app.sms.enabled=${SMS_ENABLED:false}
app.sms.provider-url=${SMS_PROVIDER_URL:}
app.sms.api-key=${SMS_API_KEY:}
app.sms.sender=${SMS_SENDER:RestroSync}

# Email invoices
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}